<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link styling</title>
</head>
<style>
    body{
        background-color: antiquewhite;
        color: brown;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        margin: 0px;
        padding: 0px;
    }
    .container{
        width: 1050px;
        height: auto;
        background-color: azure;
        padding: 20px ;
        margin: 0px auto;
    }
    .container > h1{
        text-align: center;
        font-size: 52px;
        font-family: 'Times New Roman', Times, serif;
        text-transform: uppercase;
        text-shadow: 2px 2px orange;
        font-weight: bold;
    }
    .container a{
        display: inline-block;
        background-color: cornflowerblue;
        padding: 5px 5px;
        margin: 5px;
        color: blueviolet;
        text-decoration: none;
        text-transform: uppercase;
    }
    .container a:hover{
        background-color: aquamarine;
        color: darkgreen;
        transition: 0.5s;
        padding: 15px;
    }
</style>
<body>
    <div class="container">
        <h1>Hotel Paradise Chitwan</h1>
        <a href="ismt.html">Home</a>
        <a href="#">about us</a>
        <a href="#">News & Events</a>
        <a href="#">Gallery</a>
        <a href="#">contact us</a>
    </div>

</body>
</html>
